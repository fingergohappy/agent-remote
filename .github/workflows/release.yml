# push v* tag → 发布 npm 包(trusted publishing / OIDC,免 token)。
# 前置(一次性):
#   1. 首个版本本地手动 npm publish --access public
#      (trusted publishing 配不了还不存在的包;CI 里用 token 发会被
#      npm 以 EOTP 拒绝——绕过 2FA 的 token 已不允许直接 publish)
#   2. npmjs.com → 包 Settings → Trusted Publisher:
#      GitHub Actions / fingergohappy / agent-remote / release.yml
# 发版流程:npm version patch && git push --follow-tags
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm publish --provenance 需要 OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing 需要 npm ≥ 11.5.1,node 22 自带的是 10.x
      - run: npm install -g npm@latest

      # 装上 tmux/zsh 让集成测试真跑(缺了它们测试会自动跳过,但跑上更稳)
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh

      - run: npm ci

      - run: npm run check

      - name: tag 必须与 package.json 版本一致
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 的 $PKG_VERSION 不一致"
            exit 1
          fi

      # 走 OIDC(trusted publishing),不需要任何 secret。
      - run: npm publish --access public
